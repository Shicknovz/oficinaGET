$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('API respondeu 200', function () { pm.response.to.have.status(200); });
      pm.test('Banco está conectado', function () { pm.expect(pm.response.json().database).to.eql('ok'); });
order: 1000
