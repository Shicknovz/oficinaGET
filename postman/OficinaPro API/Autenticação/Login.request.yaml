$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "senha": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login realizado', function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set('token', pm.response.json().token);
order: 2000
